name: Kinema Media checks
on:
  push:
    branches: [main, master, kinema-media]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npx playwright install chromium
      - run: npx playwright test -c playwright.single-music-bar.config.ts
      - run: npx playwright test -c playwright.integration.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: interface-failures
          path: test-results
